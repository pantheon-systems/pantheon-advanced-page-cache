name: Behat Tests

on:
  push:
    branches:
      - main
  schedule:
    # Run nightly at midnight UTC
    - cron: '0 0 * * *'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test-behat:
    name: Behat Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only run on non-fork PRs or scheduled runs (security: prevent fork PRs from accessing secrets/Pantheon infrastructure)
    if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'schedule') && (github.event.pull_request.draft == false || github.event_name == 'schedule')
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Check if we need to run Behat
        id: check_skip
        run: |
          # Run the maybe-skip-tests script to determine if tests should be skipped
          if ! ./bin/maybe-skip-tests.sh; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Only ignored files modified. Skipping Behat tests."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Setup PHP
        if: steps.check_skip.outputs.skip != 'true'
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6 # v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, xml, curl

      - name: Install Terminus
        if: steps.check_skip.outputs.skip != 'true'
        uses: pantheon-systems/terminus-github-actions@8e024bd89ff46ed2aa4e0663c6b54c87a94344f8 # v1
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}

      - name: Setup SSH
        if: steps.check_skip.outputs.skip != 'true'
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SITE_OWNER_SSH_PRIVATE_KEY }}
          log-public-key: true

      - name: Configure SSH (no strict host key checking)
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          printf "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null\n" > ~/.ssh/config

      - name: Cache Composer dependencies
        if: steps.check_skip.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: test-behat-dependencies-${{ hashFiles('composer.json') }}
          restore-keys: |
            test-behat-dependencies-

      - name: Install Composer dependencies
        if: steps.check_skip.outputs.skip != 'true'
        run: composer install -n --prefer-dist

      - name: Set GitHub OAuth Token
        if: steps.check_skip.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "GITHUB_TOKEN not available; assuming unauthenticated build"
            exit 0
          fi
          { composer config -g github-oauth.github.com "${GITHUB_TOKEN}"; } &>/dev/null

      - name: Create Random Password
        if: steps.check_skip.outputs.skip != 'true'
        run: echo "WORDPRESS_ADMIN_PASSWORD=$(openssl rand -hex 8)" >> $GITHUB_ENV

      - name: Set Environment Variables
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          echo "TERMINUS_ENV=ci-${{ github.run_number }}" >> $GITHUB_ENV
          echo "TERMINUS_SITE=pantheon-advanced-page-cache" >> $GITHUB_ENV
          echo "SITE_ENV=pantheon-advanced-page-cache.ci-${{ github.run_number }}" >> $GITHUB_ENV
          echo "WORDPRESS_ADMIN_USERNAME=pantheon" >> $GITHUB_ENV
          echo "WORDPRESS_ADMIN_EMAIL=no-reply@getpantheon.com" >> $GITHUB_ENV

      - name: Validate Fixture Version
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          wget -q https://gist.githubusercontent.com/AnaisPantheor/6f9a3360216b35b2a52cd82c887b1f9f/raw/946a793433db2404e24d83ff94938de5339ed9ab/validate-fixture-version.sh -O ./bin/validate-fixture-version.sh
          chmod +x ./bin/validate-fixture-version.sh
          ./bin/validate-fixture-version.sh

      - name: Prepare Behat
        if: steps.check_skip.outputs.skip != 'true'
        run: ./bin/behat-prepare.sh

      - name: Run Behat Tests
        if: steps.check_skip.outputs.skip != 'true'
        run: ./bin/behat-test.sh --strict

      - name: Cleanup Behat
        if: always() && steps.check_skip.outputs.skip != 'true'
        run: ./bin/behat-cleanup.sh
