name: Playwright BDD Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['**']
  workflow_dispatch:

jobs:
  playwright-bdd:
    name: Playwright BDD Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >
      (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')
      && (github.event.pull_request.draft == false || github.event_name != 'pull_request')

    env:
      TERMINUS_SITE: pantheon-advanced-page-cache
      WORDPRESS_ADMIN_USERNAME: pantheon

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Check if we need to run tests
        id: check_skip
        run: |
          if ! ./bin/maybe-skip-tests.sh; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Only ignored files modified. Skipping tests."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Setup Node.js
        if: steps.check_skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        if: steps.check_skip.outputs.skip != 'true'
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6 # v2
        with:
          php-version: '8.2'

      - name: Install Terminus
        if: steps.check_skip.outputs.skip != 'true'
        uses: pantheon-systems/terminus-github-actions@8e024bd89ff46ed2aa4e0663c6b54c87a94344f8 # v1.2.7
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}

      - name: Setup SSH
        if: steps.check_skip.outputs.skip != 'true'
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: true

      - name: Configure SSH
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          printf "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null\n" > ~/.ssh/config

      - name: Set Environment Variables
        if: steps.check_skip.outputs.skip != 'true'
        run: |
          echo "WORDPRESS_ADMIN_PASSWORD=$(openssl rand -hex 8)" >> $GITHUB_ENV
          echo "TERMINUS_ENV=ci-${{ github.run_number }}" >> $GITHUB_ENV
          echo "SITE_ENV=pantheon-advanced-page-cache.ci-${{ github.run_number }}" >> $GITHUB_ENV
          echo "WORDPRESS_ADMIN_EMAIL=no-reply@getpantheon.com" >> $GITHUB_ENV

      - name: Validate Fixture Version
        if: steps.check_skip.outputs.skip != 'true'
        uses: pantheon-systems/plugin-release-actions/validate-fixture-version@c4a1a8aac520bf6682efee843cd0f8fda8442793 # main
        with:
          terminus_site: ${{ env.TERMINUS_SITE }}

      - name: Prepare Test Environment
        if: steps.check_skip.outputs.skip != 'true'
        run: ./bin/e2e-prepare.sh

      - name: Install Node dependencies
        if: steps.check_skip.outputs.skip != 'true'
        working-directory: tests/playwright
        run: npm ci

      - name: Install Chromium
        if: steps.check_skip.outputs.skip != 'true'
        working-directory: tests/playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright BDD tests
        if: steps.check_skip.outputs.skip != 'true'
        working-directory: tests/playwright
        env:
          WP_URL: https://ci-${{ github.run_number }}-pantheon-advanced-page-cache.pantheonsite.io
          WP_USER: ${{ env.WORDPRESS_ADMIN_USERNAME }}
          WP_PASSWORD: ${{ env.WORDPRESS_ADMIN_PASSWORD }}
          HEADLESS: 'true'
          CI_UA: ${{ secrets.CI_UA }}
        run: npm test

      - name: Redact the allowlisted User-Agent from artifacts
        if: always() && steps.check_skip.outputs.skip != 'true'
        working-directory: tests/playwright
        env:
          CI_UA: ${{ secrets.CI_UA }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CI_UA:-}" ]; then
            echo "CI_UA not set, nothing to redact."
            exit 0
          fi

          DIRS="test-results playwright-report"

          # A User-Agent is sent in plaintext, so it lands in traces and reports.
          # Zips are handled separately; rewriting bytes inside an archive corrupts it.
          redact_plain() {
            grep -rlF -- "$CI_UA" "$1" 2>/dev/null | grep -v '\.zip$' || true
          }

          contains_ua() {
            local found=0
            for d in $DIRS; do
              [ -d "$d" ] || continue
              if [ -n "$(redact_plain "$d")" ]; then found=1; fi
              while IFS= read -r -d '' z; do
                if unzip -p "$z" 2>/dev/null | grep -qF -- "$CI_UA"; then found=1; fi
              done < <(find "$d" -name '*.zip' -print0)
            done
            return $((1 - found))
          }

          for d in $DIRS; do
            [ -d "$d" ] || continue

            redact_plain "$d" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              perl -pi -e 's/\Q$ENV{CI_UA}\E/REDACTED-CI-UA/g' "$f"
              echo "redacted: $f"
            done

            while IFS= read -r -d '' z; do
              unzip -p "$z" 2>/dev/null | grep -qF -- "$CI_UA" || continue
              tmp=$(mktemp -d)
              unzip -q "$z" -d "$tmp"
              grep -rlF -- "$CI_UA" "$tmp" 2>/dev/null | while IFS= read -r f; do
                perl -pi -e 's/\Q$ENV{CI_UA}\E/REDACTED-CI-UA/g' "$f"
              done
              rm -f "$z"
              (cd "$tmp" && zip -qr "$OLDPWD/$z" .)
              rm -rf "$tmp"
              echo "redacted inside: $z"
            done < <(find "$d" -name '*.zip' -print0)
          done

          if contains_ua; then
            echo "::error::CI_UA still present in artifacts after redaction. Refusing to upload."
            exit 1
          fi
          echo "Redaction complete."

      - name: Upload test results
        if: always() && steps.check_skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            tests/playwright/test-results/
            tests/playwright/playwright-report/

      - name: Cleanup Test Environment
        if: always() && steps.check_skip.outputs.skip != 'true'
        run: ./bin/e2e-cleanup.sh
