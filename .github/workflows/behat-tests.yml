name: Test Behat

on:
  pull_request:
  workflow_dispatch:
  # Nightly at 00:00 UTC (CircleCI: "0 0 * * *")
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  test-behat:
    # Skip scheduled runs unless the workflow file is on branch 'master'
    if: github.event_name != 'schedule' || github.ref_name == 'master'
    runs-on: ubuntu-latest

    # Run all steps inside the CircleCI-equivalent container
    container:
      image: quay.io/pantheon-public/build-tools-ci:8.x-php8.2
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if we need to run Behat
        run: ./bin/maybe-skip-tests.sh

      - name: Restore composer vendor cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: test-behat-dependencies-${{ hashFiles('composer.json') }}
          restore-keys: |
            test-behat-dependencies-

      - name: Install PHP deps
        run: composer install -n --prefer-dist

      - name: Save composer vendor cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vendor
          key: test-behat-dependencies-${{ hashFiles('composer.json') }}

      - name: Create Random Password
        run: echo "$(openssl rand -hex 8)" > /tmp/WORDPRESS_ADMIN_PASSWORD

      - name: Set Environment Variables
        run: |
          {
            echo "TERMINUS_ENV=ci-${GITHUB_RUN_NUMBER}"
            echo "TERMINUS_SITE=pantheon-advanced-page-cache"
            echo "SITE_ENV=pantheon-advanced-page-cache.ci-${GITHUB_RUN_NUMBER}"
            echo "WORDPRESS_ADMIN_USERNAME=pantheon"
            echo "WORDPRESS_ADMIN_EMAIL=no-reply@getpantheon.com"
            echo "WORDPRESS_ADMIN_PASSWORD=$(cat /tmp/WORDPRESS_ADMIN_PASSWORD)"
          } >> "$GITHUB_ENV"

      # Configures SSH to automatically accept new host keys.
      - name: Force SSH to ignore host keys
        run: echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" >> $GITHUB_ENV

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SITE_OWNER_SSH_PRIVATE_KEY }}

      - name: Set Composer GitHub OAuth Token (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN missing; assuming unauthenticated build"
            exit 0
          fi
          echo "Setting GitHub OAuth token (output suppressed)"
          { composer config -g github-oauth.github.com "$GITHUB_TOKEN"; } &>/dev/null

      - name: Authenticate Terminus (optional)
        env:
          TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
        run: |
          if [ -z "${TERMINUS_TOKEN:-}" ]; then
            echo "TERMINUS_TOKEN missing; assuming unauthenticated build"
            exit 0
          fi
          terminus auth:login --machine-token="$TERMINUS_TOKEN"

      - name: Validate Fixture Version
        run: |
          # Create a corrected version of the script directly
          cat << 'EOF' > ./bin/validate-fixture-version.sh
          #!/bin/bash
          set -euo pipefail
          IFS=$'\n\t'

          main(){
              export TERMINUS_HIDE_GIT_MODE_WARNING=1
              local DIRNAME
              DIRNAME=$(dirname "$0")

              local CURRENT_WP_VERSION
              CURRENT_WP_VERSION=$(curl -s https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].current')
              echo "Current WordPress Version: ${CURRENT_WP_VERSION}"

              if [ -z "${TERMINUS_SITE}" ]; then
                  echo "TERMINUS_SITE environment variable must be set"
                  exit 1
              fi

              if ! terminus whoami > /dev/null; then
                  if [ -z "${TERMINUS_TOKEN}" ]; then
                      echo "TERMINUS_TOKEN environment variable must be set or terminus already logged in."
                      exit 1
                  fi
                  terminus auth:login --machine-token="${TERMINUS_TOKEN}"
              fi

              # Use find to locate the file with a case-insensitive search
              README_FILE_PATH=$(find "${DIRNAME}"/.. -iname "readme.txt" -print -quit)
              if [[ -z "$README_FILE_PATH" ]]; then
                  echo "readme.txt not found."
                  exit 1
              fi

              local TESTED_UP_TO
              TESTED_UP_TO=$(grep -i "Tested up to:" "${README_FILE_PATH}" | tr -d '\r\n' | awk -F ': ' '{ print $2 }')
              echo "Tested Up To: ${TESTED_UP_TO}"
              local FIXTURE_VERSION
              FIXTURE_VERSION=$(terminus wp "${TERMINUS_SITE}.dev" -- core version)
              echo "Fixture Version: ${FIXTURE_VERSION}"

              local FIXTURE_VERSION_COMPARE
              FIXTURE_VERSION_COMPARE=$(php -r "echo version_compare('${FIXTURE_VERSION}', '${CURRENT_WP_VERSION}');")
              if [[ $FIXTURE_VERSION_COMPARE -eq -1 ]]; then
                  echo "Fixture Version: ${FIXTURE_VERSION} is less than Current WordPress Version: ${CURRENT_WP_VERSION}"
                  echo "Setting connection to git mode..."
                  terminus connection:set "${TERMINUS_SITE}".dev git
                  echo "Applying upstream updates on ${TERMINUS_SITE}.dev"
                  terminus upstream:updates:apply --accept-upstream "${TERMINUS_SITE}".dev
              fi

              local VERSION_COMPARE
              VERSION_COMPARE=$(php -r "echo version_compare('${TESTED_UP_TO}', '${FIXTURE_VERSION}');")

              local WP_VERSION_COMPARE
              WP_VERSION_COMPARE=$(php -r "echo version_compare('${TESTED_UP_TO}', '${CURRENT_WP_VERSION}');")

              if [[ $WP_VERSION_COMPARE -eq 0 ]]; then
                  echo "Tested Up To: ${TESTED_UP_TO} matches Current WordPress Version: ${CURRENT_WP_VERSION}"
              elif [[ $WP_VERSION_COMPARE -eq 1 ]]; then
                  echo "Tested Up To: ${TESTED_UP_TO} is greater than Current WordPress Version: ${CURRENT_WP_VERSION}"
              else
                  echo "Tested Up To: ${TESTED_UP_TO} does not match Current WordPress Version: ${CURRENT_WP_VERSION}"
                  echo "Please update ${TESTED_UP_TO} to ${CURRENT_WP_VERSION}"
                  exit 1
              fi

              if [[ $VERSION_COMPARE -eq 0 ]]; then
                  echo "Tested Up To: ${TESTED_UP_TO} matches Fixture Version: ${FIXTURE_VERSION}"
                  exit 0
              fi

              if [[ $VERSION_COMPARE -eq -1 ]]; then
                  echo "${TESTED_UP_TO} is less than ${FIXTURE_VERSION}"
                  echo "Please update ${TESTED_UP_TO} to ${FIXTURE_VERSION}"
                  exit 1
              fi

              if [[ $VERSION_COMPARE -eq 1 ]]; then
                  echo "${FIXTURE_VERSION} is less than ${TESTED_UP_TO}"

                  read -r CURRENT_MAJOR CURRENT_MINOR <<<$(echo "$CURRENT_WP_VERSION" | awk -F. '{print $1, $2}')
                  NEXT_MAJOR_VERSION="${CURRENT_MAJOR}.$((${CURRENT_MINOR}+1))"

                  if [[ "$TESTED_UP_TO" == "$NEXT_MAJOR_VERSION" ]]; then
                      echo "Tested Up To: ${TESTED_UP_TO} is the next major version after the Current WordPress Version: ${CURRENT_WP_VERSION}"
                      echo "Ensure you have validated that the plugin works on the next major version of WordPress or update ${TERMINUS_SITE} to a pre-release version."
                  else
                      echo "Tested Up To: ${TESTED_UP_TO} is not the next major version (${NEXT_MAJOR_VERSION}). This seems like an error. Please review."
                      exit 1
                  fi
              fi
          }

          main
          EOF

          # Make the new script executable and run it
          chmod +x ./bin/validate-fixture-version.sh
          ./bin/validate-fixture-version.sh

      - name: Prepare Behat
        run: ./bin/behat-prepare.sh

      - name: Run Behat Tests
        run: ./bin/behat-test.sh --strict

      - name: Cleanup Behat
        if: always()
        run: ./bin/behat-cleanup.sh
