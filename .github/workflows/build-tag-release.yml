name: Build, Tag and Release
on:
  push:
    branches:
      - release

permissions:
  pull-requests: write
  contents: write

jobs:
  tag:
    name: Create Tag and Draft Release
    runs-on: ubuntu-latest
    # Additional safety check: only run on production branches
    if: github.ref == 'refs/heads/release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, Tag & Release
        uses: pantheon-systems/plugin-release-actions/build-tag-release@ec0ee6ce8ee49452580d6bfe906ac47bc8527269 # v0.5.7
        with:
          gh_token: ${{ github.token }}
          readme_md: README.md
          build_node_assets: false
          generate_release_notes: true
