name: Lint and Test

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate-readme-spacing:
    name: Validate README Spacing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pantheon-systems/validate-readme-spacing@229ea162621009cf8e09bf2beba405017150130e # v1.0.5
  lint:
    name: PHPCS Linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/vendor
        key: test-lint-dependencies-{{ checksum "composer.json" }}
        restore-keys: test-lint-dependencies-{{ checksum "composer.json" }}
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: 8.3
    - name: Install dependencies
      run: composer install -n --prefer-dist
    - name: Run PHPCS
      run: composer lint
  php8-compatibility:
    name: PHP 8.x Compatibility
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pantheon-systems/phpcompatibility-action@bd72eb001d4fb9817c9d6e1a157a71e287f3ff80 # dev
      with:
        paths: ${{ github.workspace }}/*.php ${{ github.workspace }}/inc/*.php
        test-versions: 8.0-
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.5
    strategy:
      matrix:
        php_version: [7.4, 8.3, 8.4, 8.5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli, zip, imagick
      - name: Start MySQL Service
        run: sudo systemctl start mysql
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/vendor
          key: test-dependencies-{{ checksum "composer.json" }}
          restore-keys: test-dependencies-{{ checksum "composer.json" }}
      - name: Setup WP-CLI
        uses: godaddy-wordpress/setup-wp-cli@714a71f1679c00f5e66cb96bbe55b5bc14ef514c # 1
      - name: Install Composer dependencies
        run: |
          if [ ${{ matrix.php_version }} = "7.4" ]; then
            composer require pantheon-systems/pantheon-wp-coding-standards:^2.0 --dev --no-update
            composer update
          fi
          composer install
      - name: Run PHPUnit
        run: bash ./bin/phpunit-test.sh
