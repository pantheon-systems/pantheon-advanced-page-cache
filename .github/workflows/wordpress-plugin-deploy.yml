name: Release pantheon-advanced-page-cache plugin to wp.org
on:
  release:
    types: [published]

jobs:
  release:
    # Do not run this job for prerelease versions.
    if: ${{ ! github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install SVN if needed
      run: |
        if ! command -v svn &> /dev/null; then
          echo "SVN is not installed. Installing now..."
          sudo apt-get update
          sudo apt-get install -y subversion
        fi
    - name: WordPress Plugin Deploy
      uses: 10up/action-wordpress-plugin-deploy@2.1.1
      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SLUG: ${{ env.SLUG }}
